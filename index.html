<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fluency & Web Projects Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 40px 20px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 30px; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; text-align: left; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .card h3 { color: #f1f5f9; margin-bottom: 10px; }
        .card p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; }
        .btn { display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <h1>🚀 My AI Fluency & Projects Hub</h1>
    <p>All my Web Development & AI projects hosted in one place.</p>

    <div class="projects-grid">

        <!-- Project 1: Flyrank Internship -->
        <div class="card">
            <h3>Flyrank Internship AI Fluency</h3>
            <p>AI Fluency project submission for Flyrank internship.</p>
            <a href="./flyrank-internship/" class="btn" target="_blank">View Live Demo</a>
        </div>

        <!-- Project 2 (Example for future projects) -->
        <!-- 
        <div class="card">
            <h3>Project Title Here</h3>
            <p>Short description of the new project.</p>
            <a href="./new-project-folder/" class="btn" target="_blank">View Live Demo</a>
        </div> 
        -->

    </div>

</body>
</html>
